name: Good Times audit checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'index.html'
      - 'vite.config.*'
      - '.github/workflows/good-times-audit.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply counted verified logic changes
        run: node scripts/apply-verified-app-fixes.mjs
      - name: Refresh dependency tree and lockfile
        run: npm install --ignore-scripts
      - name: Generate valid square PWA icons
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Image.open('public/good-times-logo.png').convert('RGBA')
          output = Path('public/icons')
          output.mkdir(parents=True, exist_ok=True)

          for size, max_width in ((192, 136), (512, 360)):
              ratio = min(max_width / source.width, (size * 0.55) / source.height)
              resized = source.resize(
                  (max(1, round(source.width * ratio)), max(1, round(source.height * ratio))),
                  Image.Resampling.LANCZOS,
              )
              canvas = Image.new('RGBA', (size, size), '#06060C')
              position = ((size - resized.width) // 2, (size - resized.height) // 2)
              canvas.alpha_composite(resized, position)
              destination = output / f'good-times-{size}.png'
              canvas.convert('RGB').save(destination, format='PNG', optimize=True)
              with Image.open(destination) as verified:
                  if verified.size != (size, size):
                      raise SystemExit(f'{destination} is {verified.size}, expected {(size, size)}')
                  print(destination, verified.size)
          PY
      - run: node --test scripts/gt-auth-session.test.mjs scripts/direct-request-validation.test.mjs
      - run: npm run build
      - name: Generate and synchronize Android project
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi
          npx cap sync android
          chmod +x android/gradlew
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Commit generated app, lockfile, PWA icons, and Android project
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- src/App.jsx package-lock.json public/icons android; then
            echo "Generated files are current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.jsx package-lock.json public/icons android
            git commit -m "fix: correct app logic and complete installable builds"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Capture dependency audit
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: good-times-dependency-diagnosis
          path: npm-audit.json
          retention-days: 7
