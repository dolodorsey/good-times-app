name: Good Times audit checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/good-times-audit.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh dependency tree and lockfile
        run: npm install --ignore-scripts
      - name: Commit synchronized lockfile
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize package lock"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: node --test scripts/gt-auth-session.test.mjs
      - run: npm run build
      - name: Capture dependency audit
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: good-times-dependency-diagnosis
          path: npm-audit.json
          retention-days: 7
