name: Good Times audit checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'index.html'
      - 'vite.config.*'
      - '.github/workflows/good-times-audit.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply counted verified logic changes
        run: node scripts/apply-verified-app-fixes.mjs
      - name: Refresh dependency tree and lockfile
        run: npm install --ignore-scripts
      - name: Generate valid square PWA icons
        run: |
          mkdir -p public/icons
          convert public/good-times-logo.png -resize 360x220 -gravity center -background '#06060C' -extent 512x512 public/icons/good-times-512.png
          convert public/good-times-logo.png -resize 136x84 -gravity center -background '#06060C' -extent 192x192 public/icons/good-times-192.png
          identify -format '%f %wx%h\n' public/icons/good-times-192.png public/icons/good-times-512.png
      - run: node --test scripts/gt-auth-session.test.mjs scripts/direct-request-validation.test.mjs
      - run: npm run build
      - name: Generate and synchronize Android project
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi
          npx cap sync android
          chmod +x android/gradlew
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Commit generated app, lockfile, PWA icons, and Android project
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- src/App.jsx package-lock.json public/icons android; then
            echo "Generated files are current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.jsx package-lock.json public/icons android
            git commit -m "fix: correct app logic and complete installable builds"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Capture dependency audit
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: good-times-dependency-diagnosis
          path: npm-audit.json
          retention-days: 7
