name: Good Times audit checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/good-times-audit.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test scripts/gt-auth-session.test.mjs
      - run: npm run build
      - name: Capture dependency audit
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: good-times-npm-audit
          path: npm-audit.json
          retention-days: 7
