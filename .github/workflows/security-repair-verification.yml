name: GOOD TIMES redacted security verification
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/security-repair-verification.yml
      - scripts/security-finding-metadata.py
      - .gitleaks.toml
      - .gitleaksignore
permissions:
  contents: read
concurrency:
  group: security-repair-metadata-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    if: github.head_ref == 'fix/security-history-snapshot-20260927' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gt-gitleaks"
          cd "$RUNNER_TEMP/gt-gitleaks"
          BASE=https://github.com/gitleaks/gitleaks/releases/download/v8.24.3
          curl --fail --silent --show-error --location --retry 2 "$BASE/gitleaks_8.24.3_linux_x64.tar.gz" -o gitleaks_8.24.3_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 2 "$BASE/gitleaks_8.24.3_checksums.txt" -o checksums.txt
          grep ' gitleaks_8.24.3_linux_x64.tar.gz$' checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
          echo "$RUNNER_TEMP/gt-gitleaks" >> "$GITHUB_PATH"
      - name: Redacted full-history and current-tree verification
        run: python3 scripts/security-finding-metadata.py
