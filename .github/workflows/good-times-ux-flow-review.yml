name: GOOD TIMES Planner Flow Review
on:
  push:
    branches: [upgrade/home-discovery-planner-20260925]
    paths: [.github/workflows/good-times-ux-flow-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply only the two reviewed files
        env:
          GT_BRANCH: ${{ github.ref_name }}
        run: |
          test "$GT_BRANCH" = 'upgrade/home-discovery-planner-20260925'
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          source=Path('.changes/ux-flow-review.json');bundle=json.loads(source.read_text())
          if bundle['base_sha']!='6f22c4b22000651cd1607312ce0a050a2a612afc':raise RuntimeError('Unexpected baseline')
          allowed={'src/features/experience/GoodTimesPlannerStudio.jsx','scripts/good-times-ux-final-review.test.mjs'}
          digest=lambda text:hashlib.sha256(text.encode()).hexdigest()
          pending=[]
          for change in bundle['files']:
              name=change['path']
              if name not in allowed:raise RuntimeError('Unapproved or duplicate file')
              allowed.remove(name);text=Path(name).read_text()
              if digest(text)!=change['expected_sha256']:raise RuntimeError('Concurrent source change')
              for before,after in change['replacements']:
                  if text.count(before)!=1:raise RuntimeError('Ambiguous source anchor')
                  text=text.replace(before,after)
              text+=change.get('append','')
              if digest(text)!=change['sha256']:raise RuntimeError('Output mismatch')
              pending.append((name,text))
          if allowed:raise RuntimeError('Missing file')
          for name,text in pending:Path(name).write_text(text);print('APPLIED',name,digest(text))
          source.unlink();Path('.github/workflows/good-times-ux-flow-review.yml').unlink()
          PY
      - name: Build and test before committing
        run: |
          npm ci
          mkdir -p .ux-review
          set -o pipefail
          npm run build 2>&1 | tee .ux-review/build-and-tests.log
      - name: Commit only to the isolated feature branch
        run: |
          git config user.name 'GOOD TIMES UX Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/experience/GoodTimesPlannerStudio.jsx scripts/good-times-ux-final-review.test.mjs .changes/ux-flow-review.json .github/workflows/good-times-ux-flow-review.yml
          git commit -m 'GOOD TIMES: reveal the next planning step and shake result immediately'
          git push origin HEAD:upgrade/home-discovery-planner-20260925
          git rev-parse HEAD > .ux-review/source-sha.txt
          echo "GT_UX_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install screenshot browser
        run: npx playwright-core install --with-deps chromium
      - name: Capture actual app screens and enforce visual geometry checks
        run: |
          set -o pipefail
          node scripts/ux-component-review.mjs 2>&1 | tee .ux-review/browser-review.log
      - name: Preserve evidence including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: good-times-ux-proof-pass4
          path: .ux-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
