name: GOOD TIMES UX Candidate
on:
  push:
    branches: [upgrade/home-discovery-planner-20260925]
    paths:
      - .github/workflows/good-times-ux-candidate.yml
      - src/**
      - api/**
      - scripts/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: good-times-ux-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Record exact source identity
        run: |
          mkdir -p .ux-review
          git rev-parse HEAD > .ux-review/source-sha.txt
          echo "GT_UX_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci
      - name: Build and run all source contract tests
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .ux-review/build-and-tests.log
      - name: Install screenshot browser
        run: npx playwright-core install --with-deps chromium
      - name: Render actual screens against read-only public inventory
        run: |
          set -o pipefail
          node scripts/ux-component-review.mjs 2>&1 | tee .ux-review/browser-review.log
      - name: Preserve screenshots and exact evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: good-times-ux-proof
          path: .ux-review/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
