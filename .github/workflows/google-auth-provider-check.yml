name: GOOD TIMES Google Auth Provider Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-google-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Supabase Google provider
        shell: bash
        env:
          SUPABASE_URL: https://czocqfaovfpjweayniuw.supabase.co
          SUPABASE_PUBLIC_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6b2NxZmFvdmZwandlYXluaXV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzNzEzODAsImV4cCI6MjA4Mzk0NzM4MH0.6-3rmA9tZXHLVg5N6a_82rKA9Kvrj4gRrUUiSczovho
        run: |
          set -euo pipefail
          body="$(curl -L --fail --silent --show-error --retry 3 --connect-timeout 8 --max-time 20 -H "apikey: $SUPABASE_PUBLIC_KEY" "$SUPABASE_URL/auth/v1/settings")"
          printf '%s' "$body" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          external=d.get("external") or {}
          enabled=external.get("google") is True
          print("Google OAuth enabled:", enabled)
          if not enabled:
              print("Google OAuth is not enabled yet; GOOD TIMES will keep the Google button hidden until credentials are configured.")
          '
