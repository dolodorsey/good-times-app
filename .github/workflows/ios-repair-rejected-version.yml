name: GOOD TIMES Repair Rejected App Store Version — RETIRED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Stop obsolete repair path
        run: |
          echo "This workflow is retired. It previously renamed the rejected 1.0 version and attached build 250."
          echo "Build 250 is obsolete and must not be attached or resubmitted."
          echo "Use the current iOS build pipeline, select the newly validated App Store Connect build, then use GOOD TIMES Resubmit App Review with explicit version/build inputs."
          exit 1
