# Final App Review execution trigger: 2026-08-18
name: GOOD TIMES Finalize App Review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-app-review-finalize.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GT_UI_ARTIFACTS: 'ui-artifacts'
      VALIDATED_UI_ARTIFACT_ID: '9345864431'
    steps:
      - uses: actions/checkout@v4
      - name: Validate finalizer
        run: python3 -m py_compile scripts/app-store-review-finalize.py
      - name: Load validated screenshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ui-artifacts
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VALIDATED_UI_ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/ui-artifact.zip"
          unzip -q "$RUNNER_TEMP/ui-artifact.zip" -d ui-artifacts
          test -s ui-artifacts/app-store/iphone-6.9/01-home.png
          test -s ui-artifacts/app-store/iphone-6.9/02-dates.png
          test -s ui-artifacts/app-store/iphone-6.9/03-explore.png
      - name: Install App Store Connect client
        run: python3 -m pip install --disable-pip-version-check --quiet pyjwt cryptography requests
      - name: Restore iPhone screenshots and resubmit after propagation
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 scripts/app-store-review-finalize.py
      - name: Preserve finalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOOD-TIMES-app-review-finalize-${{ github.run_number }}
          path: ${{ runner.temp }}/good-times-app-store-finalize.json
          if-no-files-found: warn
          retention-days: 30
      - name: Post finalization result to issue 69
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/good-times-app-store-finalize.json"
          if [ -f "$FILE" ]; then BODY=$(cat "$FILE"); else BODY='{"ok":false,"error":"finalization evidence missing"}'; fi
          jq -n --arg body "## GOOD TIMES final App Review result\n\n\`\`\`json\n${BODY}\n\`\`\`" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @"$RUNNER_TEMP/comment.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/69/comments" >/dev/null
