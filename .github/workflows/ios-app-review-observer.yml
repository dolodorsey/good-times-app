name: GOOD TIMES App Store Remediation Observer

on:
  workflow_run:
    workflows: ["GOOD TIMES App Store Review Remediation"]
    types: [requested, in_progress, completed]

permissions:
  contents: read
  issues: write

env:
  ISSUE_NUMBER: '69'

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Post workflow run status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          BODY="App Store remediation workflow run ${RUN_ID}: status=${RUN_STATUS}, conclusion=${RUN_CONCLUSION:-pending}, commit=${RUN_SHA}, ${RUN_URL}"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @"$RUNNER_TEMP/comment.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" >/dev/null
