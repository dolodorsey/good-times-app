name: Screen audit

# Gates every change to the customer-facing app on the same visual checks that
# caught the 2026-08-15 defects: a blank render when the font host is
# unreachable, primary nav laid out below the fold, fixed chrome covering
# content, touch targets under 44px, horizontal overflow, and broken images.
#
# See scripts/screen-audit.mjs. Run it locally with: npm run audit:screens

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/screen-audit.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: screen-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # devDependencies are required (vite, playwright-core). Pin NODE_ENV so a
      # runner default can never silently skip them the way it does locally.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: Resolve a Chrome binary
        id: chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "path=$(command -v google-chrome)" >> "$GITHUB_OUTPUT"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "path=$(command -v chromium-browser)" >> "$GITHUB_OUTPUT"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser
            echo "path=$(command -v chromium-browser)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          NODE_ENV: development

      # The build codemods rewrite tracked source. If that leaves changes behind,
      # the committed source and the built output have drifted apart.
      - name: Report build-time source drift
        run: |
          if [ -n "$(git status --porcelain -- src index.html api)" ]; then
            echo "::warning::npm run build modified tracked source files:"
            git status --porcelain -- src index.html api
          fi

      - name: Serve the production build
        run: |
          nohup node scripts/serve-dist.mjs > /tmp/serve-dist.log 2>&1 &
          disown || true
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4180/; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server failed to start"; exit 1

      - name: Screen audit
        run: node scripts/screen-audit.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-audit-${{ github.run_id }}
          path: .audit
          retention-days: 14
          if-no-files-found: warn
