name: GOOD TIMES Header Release Review
on:
  push:
    branches: [upgrade/home-discovery-planner-20260925]
    paths: [.github/workflows/good-times-header-release-fix.yml]
permissions:
  contents: write
jobs:
  header-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Correct only the reviewed wordmark and topbar styles
        env:
          GT_BRANCH: ${{ github.ref_name }}
        run: |
          test "$GT_BRANCH" = 'upgrade/home-discovery-planner-20260925'
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('src/features/experience/good-times-ux.css');s=p.read_text()
          digest=lambda s:hashlib.sha256(s.encode()).hexdigest()
          if digest(s)!='23d7b438db5f7b5195de6d3175c5bdde6c7774c9793da69c2ef041d8ee099c34':raise RuntimeError('Concurrent stylesheet change')
          edits=[('.gt-premium-experience .gt5-app.gt-ux-shell[data-screen] .gt5-topbar{height:64px;min-height:64px;flex-basis:64px;padding:8px 14px}', '.gt-premium-experience .gt5-app.gt-ux-shell[data-screen] .gt5-topbar{height:58px;min-height:58px;flex-basis:58px;padding:6px 14px}'),('.gt-premium-experience .gt5-app.gt-ux-shell[data-screen] .gt5-brand strong{font:600 14px/1.2 var(--gt5-sans);letter-spacing:.08em}', '.gt-premium-experience .gt5-app.gt-ux-shell[data-screen] .gt5-brand strong{font:500 16px/1.2 var(--gt5-serif);font-family:var(--gt5-serif)!important;letter-spacing:.05em}')]
          for before,after in edits:
              if s.count(before)!=1:raise RuntimeError('Unexpected style anchor')
              s=s.replace(before,after)
          s+='\n@media(max-width:359px){.gt-premium-experience .gt5-app.gt-ux-shell[data-screen] .gt5-brand strong{font-size:14px}}\n@media(min-width:700px){.gt-premium-experience .gt5-app.gt-ux-shell[data-screen] .gt5-topbar{height:64px;min-height:64px;flex-basis:64px;padding:8px 14px}}\n'
          if digest(s)!='376037b4e03b45b858be90ad5f7d12b28f5654d318f7c74390055c798585f629':raise RuntimeError('Unexpected output')
          p.write_text(s)
          Path('.github/workflows/good-times-header-release-fix.yml').unlink()
          PY
      - name: Validate source and dependencies
        run: |
          npm ci --include=dev
          mkdir -p ui-artifacts
          set -o pipefail
          npm run verify 2>&1 | tee ui-artifacts/source-verify.log
      - name: Commit the stylesheet fix on the feature branch
        run: |
          git config user.name 'GOOD TIMES UX Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/experience/good-times-ux.css .github/workflows/good-times-header-release-fix.yml
          git commit -m 'GOOD TIMES: retain the editorial wordmark and compact 58px phone header'
          git push origin HEAD:upgrade/home-discovery-planner-20260925
          git rev-parse HEAD > ui-artifacts/source-sha.txt
          echo "GT_UX_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: browser-actions/setup-chrome@v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - name: Serve the tested bundle
        run: |
          GT_UI_HEALTH_FIXTURE=healthy node scripts/serve-dist.mjs > ui-artifacts/server.log 2>&1 &
          for i in $(seq 1 30); do if curl -sf -o /dev/null http://localhost:4180/; then exit 0; fi; sleep 1; done
          exit 1
      - name: Repeat the full rendered checks and real-inventory screenshots
        env:
          GT_UI_BASE: http://localhost:4180
          GT_UI_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GT_UI_ARTIFACTS: ui-artifacts
          GT_UX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set +e
          set -o pipefail
          timeout 600s node --test --test-concurrency=1 scripts/app-review-ipad-rendered.test.mjs scripts/event-clock-rendered.test.mjs scripts/reference-base-rendered.test.mjs scripts/home-discover-reference-rendered.test.mjs scripts/customer-enhancements-rendered.test.mjs scripts/ui-geometry.test.mjs scripts/ui-creative-assets.test.mjs scripts/ui-mobile-utilities.test.mjs scripts/ui-font-resilience.test.mjs scripts/ui-interaction.test.mjs 2>&1 | tee ui-artifacts/rendered-tests.log
          rendered=${PIPESTATUS[0]}
          timeout 180s node scripts/ux-component-review.mjs 2>&1 | tee ui-artifacts/live-inventory-components.log
          components=${PIPESTATUS[0]}
          printf '{"rendered_exit":%s,"live_components_exit":%s}\n' "$rendered" "$components" > ui-artifacts/review-result.json
          test "$rendered" -eq 0 -a "$components" -eq 0
      - name: Retain screenshot evidence including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: good-times-header-release-review
          path: |
            ui-artifacts/
            .ux-review/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
