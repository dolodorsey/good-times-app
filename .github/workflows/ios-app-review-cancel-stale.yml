name: GOOD TIMES Cancel Stale App Store Remediation Runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-app-review-cancel-stale.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel every still-running remediation attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IDS=""
          for STATUS in in_progress queued waiting; do
            RESPONSE=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ios-app-review-remediation.yml/runs?status=${STATUS}&per_page=100")
            FOUND=$(printf '%s' "$RESPONSE" | jq -r '.workflow_runs[].id')
            IDS="$IDS $FOUND"
          done
          IDS=$(printf '%s\n' $IDS | sort -u | tr '\n' ' ' | xargs || true)
          if [ -n "$IDS" ]; then
            for ID in $IDS; do
              echo "Canceling stale remediation run $ID"
              curl --fail --silent --show-error -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${ID}/cancel" >/dev/null || true
            done
          fi
          BODY="Stale App Store remediation cleanup complete. Canceled run IDs: ${IDS:-none}."
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @"$RUNNER_TEMP/comment.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/69/comments" >/dev/null
