name: GOOD TIMES UX Workspace
on:
  push:
    branches: [upgrade/home-discovery-planner-20260925]
    paths: [.github/workflows/good-times-ux-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Install browser for actual screenshots
        run: npx playwright-core install --with-deps chromium
      - name: Read public inventory and capture public baseline
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          mkdir -p ux-workspace-evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';
          const root='https://thegoodtimesworldwide.com';
          const evidence={sha:process.env.GITHUB_SHA,captured_at:new Date().toISOString(),scope:'Public production baseline; no authenticated customer session used',requests:[]};
          for(const path of ['/api/data?city=atlanta&event_limit=120&venue_limit=180','/api/health']){
            try{
              const response=await fetch(root+path,{signal:AbortSignal.timeout(15000)});
              const text=await response.text();
              evidence.requests.push({path,status:response.status,bytes:text.length});
              fs.writeFileSync('ux-workspace-evidence/'+(path.startsWith('/api/data')?'inventory.json':'health.json'),text);
            }catch(error){evidence.requests.push({path,error:error.message});}
          }
          const browser=await chromium.launch({headless:true});
          for(const viewport of [{width:390,height:844},{width:1440,height:1000}]){
            const page=await browser.newPage({viewport});
            try{
              await page.goto(root,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(5000);
              await page.screenshot({path:`ux-workspace-evidence/production-public-${viewport.width}.png`,fullPage:true,timeout:20000});
              evidence[`page_${viewport.width}`]={title:await page.title(),url:page.url(),text:(await page.locator('body').innerText()).slice(0,2500)};
            }catch(error){evidence[`page_${viewport.width}`]={error:error.message};}
            await page.close();
          }
          await browser.close();
          fs.writeFileSync('ux-workspace-evidence/manifest.json',JSON.stringify(evidence,null,2));
          NODE
      - name: Package exact source and installed dependencies for offline development
        run: |
          tar --exclude=.git --exclude=good-times-ux-workspace.tgz -czf /tmp/good-times-ux-workspace.tgz .
          mv /tmp/good-times-ux-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: good-times-ux-workspace
          path: good-times-ux-workspace.tgz
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: good-times-production-public-baseline
          path: ux-workspace-evidence/
          retention-days: 14
