name: GOOD TIMES Complete Release Review
on:
  push:
    branches: [upgrade/home-discovery-planner-20260925]
    paths: [.github/workflows/good-times-release-repair.yml]
permissions:
  contents: write
jobs:
  release-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply the reviewed source delta atomically
        env:
          GT_BRANCH: ${{ github.ref_name }}
        run: |
          test "$GT_BRANCH" = 'upgrade/home-discovery-planner-20260925'
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,gzip,base64
          packed=base64.b64decode(Path('.changes/release-regression.b64').read_text())
          digest=lambda raw:hashlib.sha256(raw).hexdigest()
          if digest(packed)!='dfad990c4aa381a1fabc077b288a01b300cb52ec2b71956b1be28b097b2e54fa':raise RuntimeError('Transfer checksum mismatch')
          bundle=json.loads(gzip.decompress(packed))
          if bundle['base_sha']!='72fb3c1003a72d81427e05afc48eb9c6c2a057e5':raise RuntimeError('Unexpected source baseline')
          allowed={'.github/workflows/good-times-release-gates.yml','scripts/app-store-screenshot-capture.mjs','scripts/customer-enhancements-rendered.test.mjs','scripts/home-discover-reference-rendered.test.mjs','scripts/reference-base-rendered.test.mjs','scripts/ui-creative-assets.test.mjs','scripts/ui-geometry.test.mjs','scripts/ui-interaction.test.mjs','scripts/ui-mobile-utilities.test.mjs','src/features/experience/GoodTimesCommandAppV4.jsx','src/features/experience/GoodTimesPlannerStudio.jsx','src/features/experience/GoodTimesUXScreens.jsx','src/features/experience/good-times-ux.css','scripts/ux-render-fixtures.mjs'}
          pending=[]
          for change in bundle['files']:
              name=change['path']
              if name not in allowed:raise RuntimeError('Unapproved or duplicate path: '+name)
              allowed.remove(name)
              if 'expected_sha256' in change:
                  old=Path(name).read_bytes()
                  if digest(old)!=change['expected_sha256']:raise RuntimeError('Concurrent source change: '+name)
                  if change.get('delete'):
                      if name!='.github/workflows/good-times-release-gates.yml':raise RuntimeError('Unapproved deletion')
                      pending.append((name,None));continue
                  lines=old.decode().splitlines(keepends=True)
                  for edit in sorted(change['edits'],key=lambda edit:edit['start'],reverse=True):
                      if not 0<=edit['start']<=edit['end']<=len(lines):raise RuntimeError('Invalid edit bounds')
                      lines[edit['start']:edit['end']]=[edit['text']]
                  text=''.join(lines)
              else:
                  if Path(name).exists():raise RuntimeError('New file already exists: '+name)
                  text=change['content']
              if digest(text.encode())!=change['sha256']:raise RuntimeError('Output checksum mismatch: '+name)
              pending.append((name,text))
          if allowed:raise RuntimeError('Missing reviewed files')
          for name,text in pending:
              if text is None:Path(name).unlink()
              else:Path(name).write_text(text)
              print('APPLIED',name)
          Path('.changes/release-regression.b64').unlink()
          Path('.github/workflows/good-times-release-repair.yml').unlink()
          PY
      - name: Validate build and dependency audit before committing
        run: |
          npm ci --include=dev
          mkdir -p ui-artifacts
          set -o pipefail
          npm run verify 2>&1 | tee ui-artifacts/source-verify.log
      - name: Commit to the feature branch without bypassing production protection
        run: |
          git config user.name 'GOOD TIMES UX Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/good-times-release-gates.yml scripts/app-store-screenshot-capture.mjs scripts/customer-enhancements-rendered.test.mjs scripts/home-discover-reference-rendered.test.mjs scripts/reference-base-rendered.test.mjs scripts/ui-creative-assets.test.mjs scripts/ui-geometry.test.mjs scripts/ui-interaction.test.mjs scripts/ui-mobile-utilities.test.mjs scripts/ux-render-fixtures.mjs src/features/experience/GoodTimesCommandAppV4.jsx src/features/experience/GoodTimesPlannerStudio.jsx src/features/experience/GoodTimesUXScreens.jsx src/features/experience/good-times-ux.css .changes/release-regression.b64 .github/workflows/good-times-release-repair.yml
          git commit -m 'GOOD TIMES: fix editorial typography, dense lists and complete redesigned UX regression coverage'
          git push origin HEAD:upgrade/home-discovery-planner-20260925
          git rev-parse HEAD > ui-artifacts/source-sha.txt
          echo "GT_UX_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: browser-actions/setup-chrome@v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - name: Serve the actual production bundle on the test runner
        run: |
          GT_UI_HEALTH_FIXTURE=healthy node scripts/serve-dist.mjs > ui-artifacts/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4180/; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Execute every established rendered suite and preserve all failures
        env:
          GT_UI_BASE: http://localhost:4180
          GT_UI_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GT_UI_ARTIFACTS: ui-artifacts
          GT_UX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set +e
          set -o pipefail
          timeout 1200s node --test --test-concurrency=1 scripts/app-review-ipad-rendered.test.mjs scripts/event-clock-rendered.test.mjs scripts/reference-base-rendered.test.mjs scripts/home-discover-reference-rendered.test.mjs scripts/customer-enhancements-rendered.test.mjs scripts/ui-geometry.test.mjs scripts/ui-creative-assets.test.mjs scripts/ui-mobile-utilities.test.mjs scripts/ui-font-resilience.test.mjs scripts/ui-interaction.test.mjs 2>&1 | tee ui-artifacts/rendered-tests.log
          rendered=${PIPESTATUS[0]}
          timeout 180s node scripts/app-store-screenshot-capture.mjs 2>&1 | tee ui-artifacts/store-layout.log
          store=${PIPESTATUS[0]}
          timeout 300s node scripts/ux-component-review.mjs 2>&1 | tee ui-artifacts/live-inventory-components.log
          components=${PIPESTATUS[0]}
          printf '{"rendered_exit":%s,"store_layout_exit":%s,"live_components_exit":%s}\n' "$rendered" "$store" "$components" > ui-artifacts/review-result.json
          test "$rendered" -eq 0 -a "$store" -eq 0 -a "$components" -eq 0
      - name: Preserve real screenshots and logs even when a test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: good-times-complete-release-review
          path: |
            ui-artifacts/
            .ux-review/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
