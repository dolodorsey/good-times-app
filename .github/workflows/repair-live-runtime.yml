name: Verify Good Times Live Runtime

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact application dependencies
        run: npm install --legacy-peer-deps
      - name: Verify GOOD TIMES regression suite
        run: npm run test
      - name: Verify production build pipeline
        run: npm run build
