name: GOOD TIMES source health

on:
  pull_request:
    paths:
      - 'supabase/functions/gt-atlanta-venue-adapters/**'
      - 'supabase/migrations/2026080223*.sql'
      - 'supabase/rollbacks/2026080223*.sql'
      - '.github/workflows/good-times-source-health.yml'
  push:
    branches:
      - fix/good-times-source-health-2026-08-02

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check official venue adapter
        run: deno check supabase/functions/gt-atlanta-venue-adapters/index.ts
      - name: Verify timezone safeguards
        run: |
          grep -q 'America/New_York' supabase/functions/gt-atlanta-venue-adapters/index.ts
          grep -q 'original_event_datetime' supabase/functions/gt-atlanta-venue-adapters/index.ts
          ! grep -q 'dateValue.toISOString().slice(0, 10)' supabase/functions/gt-atlanta-venue-adapters/index.ts
      - name: Verify server-only grants and rollback
        run: |
          grep -q 'revoke all on function public.gt_run_atlanta_official_venue_adapters' supabase/migrations/20260802232000_schedule_good_times_official_venue_adapters.sql
          grep -q 'to service_role, postgres' supabase/migrations/20260802232000_schedule_good_times_official_venue_adapters.sql
          grep -q 'cron.unschedule' supabase/rollbacks/20260802232000_schedule_good_times_official_venue_adapters.rollback.sql
      - name: Verify bounded supported sources
        run: |
          grep -q 'SUPPORTED_SOURCE_IDS' supabase/functions/gt-atlanta-venue-adapters/index.ts
          grep -q 'MAX_BODY_BYTES' supabase/functions/gt-atlanta-venue-adapters/index.ts
          grep -q 'MAX_FETCH_BYTES' supabase/functions/gt-atlanta-venue-adapters/index.ts
