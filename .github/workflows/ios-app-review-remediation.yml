# GOOD TIMES App Store remediation — production execution uses the already-passed UI artifact.
name: GOOD TIMES App Store Review Remediation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-app-review-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

concurrency:
  group: good-times-app-store-remediation-main
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_VERSION: '1.1.0'
      MIN_BUILD_UPLOADED_AT: '2026-08-18T23:12:00Z'
      GT_UI_ARTIFACTS: 'ui-artifacts'
      VALIDATED_UI_ARTIFACT_ID: '9345864431'
    steps:
      - name: Mark remediation execution started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="GOOD TIMES App Store remediation started. run=${GITHUB_RUN_ID}, commit=${GITHUB_SHA}."
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' --data-binary @"$RUNNER_TEMP/comment.json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/69/comments" >/dev/null

      - uses: actions/checkout@v4

      - name: Validate remediation source
        run: python3 -m py_compile scripts/app-store-review-remediation.py

      - name: Download the fully validated App Store screenshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ui-artifacts
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VALIDATED_UI_ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/ui-artifact.zip"
          unzip -q "$RUNNER_TEMP/ui-artifact.zip" -d ui-artifacts
          test -s ui-artifacts/app-store/iphone-6.9/01-home.png
          test -s ui-artifacts/app-store/iphone-6.9/02-dates.png
          test -s ui-artifacts/app-store/iphone-6.9/03-explore.png
          test -s ui-artifacts/app-store/ipad-13/01-home.png
          test -s ui-artifacts/app-store/ipad-13/02-dates.png
          test -s ui-artifacts/app-store/ipad-13/03-explore.png

      - name: Mark validated screenshots loaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="App Store remediation milestone: validated app-in-use iPhone and 13-inch iPad screenshots loaded from passing UI regression run 32195879234."
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' --data-binary @"$RUNNER_TEMP/comment.json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/69/comments" >/dev/null

      - name: Install App Store Connect client dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet pyjwt cryptography requests

      - name: Get review credentials from the OIDC-protected GOOD TIMES vault
        run: |
          set -euo pipefail
          OIDC_RESPONSE=$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=good-times-app-review")
          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != null
          CREDS=$(curl --fail --silent --show-error -H "Authorization: Bearer $OIDC_TOKEN" 'https://czocqfaovfpjweayniuw.supabase.co/functions/v1/good-times-app-review-credential-vault')
          REVIEW_USERNAME=$(printf '%s' "$CREDS" | jq -r '.username')
          REVIEW_PASSWORD=$(printf '%s' "$CREDS" | jq -r '.password')
          test -n "$REVIEW_USERNAME" && test "$REVIEW_USERNAME" != null
          test -n "$REVIEW_PASSWORD" && test "$REVIEW_PASSWORD" != null
          echo "::add-mask::$REVIEW_PASSWORD"
          echo "REVIEW_USERNAME=$REVIEW_USERNAME" >> "$GITHUB_ENV"
          echo "REVIEW_PASSWORD=$REVIEW_PASSWORD" >> "$GITHUB_ENV"

      - name: Mark review credentials verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="App Store remediation milestone: Apple reviewer credentials loaded securely from the OIDC-protected GOOD TIMES Supabase vault."
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' --data-binary @"$RUNNER_TEMP/comment.json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/69/comments" >/dev/null

      - name: Update App Store review package and attach fresh post-fix build
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 scripts/app-store-review-remediation.py

      - name: Preserve remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOOD-TIMES-app-store-remediation-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/good-times-app-store-remediation.json
            ${{ runner.temp }}/good-times-app-store-remediation.md
            ui-artifacts/app-store
          if-no-files-found: warn
          retention-days: 30

      - name: Post non-secret execution evidence to issue 69
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT="$RUNNER_TEMP/good-times-app-store-remediation.md"
          if [ ! -f "$REPORT" ]; then
            printf '%s\n' '## GOOD TIMES App Store remediation' '' '- **Result:** INCOMPLETE' '- Workflow stopped before App Store remediation evidence was written.' > "$REPORT"
          fi
          jq -n --rawfile body "$REPORT" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' --data-binary @"$RUNNER_TEMP/comment.json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/69/comments" >/dev/null
