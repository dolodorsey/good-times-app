name: Restore Good Times Command Experience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply command restoration
        run: node scripts/restore-good-times-command.mjs
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build production app
        run: npm run build
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/experience/GoodTimesCommandApp.jsx src/features/intelligence/client.js src/main.jsx
          git commit -m "Restore fixed navigation, Explore taxonomy, and Build My Night"
          git push
