name: GOOD TIMES App Store Metadata v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-metadata-publish-v4.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check --quiet pyjwt cryptography requests
      - name: Publish first-release metadata and verify
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          import jwt, requests
          BASE='https://api.appstoreconnect.apple.com/v1'; BUNDLE='com.kollective.goodtimes'; VERSION='1.1.0'; LOCALE='en-US'; ROOT=Path.cwd()
          token=jwt.encode({'iss':os.environ['ASC_ISSUER_ID'],'iat':int(time.time()),'exp':int(time.time())+900,'aud':'appstoreconnect-v1'},os.environ['ASC_PRIVATE_KEY'],algorithm='ES256',headers={'kid':os.environ['ASC_KEY_ID'],'typ':'JWT'})
          H={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def req(method,path,params=None,payload=None):
              r=requests.request(method,BASE+path,headers=H,params=params,json=payload,timeout=45)
              if not r.ok: raise SystemExit(f'{method} {path} HTTP {r.status_code}: {r.text[:4000]}')
              return {} if r.status_code==204 or not r.content else r.json()
          def read(p): return (ROOT/p).read_text(encoding='utf-8').strip()
          apps=req('GET','/apps',{'filter[bundleId]':BUNDLE,'limit':'10'})['data']; app=[a for a in apps if a.get('attributes',{}).get('bundleId')==BUNDLE]
          if len(app)!=1: raise SystemExit('GOOD TIMES app resolution failed')
          app_id=app[0]['id']; vers=req('GET',f'/apps/{app_id}/appStoreVersions',{'limit':'200'})['data']; matches=[v for v in vers if v.get('attributes',{}).get('platform')=='IOS' and v.get('attributes',{}).get('versionString')==VERSION]
          if len(matches)!=1: raise SystemExit(f'Expected one iOS {VERSION}, found {len(matches)}')
          v=matches[0]; vid=v['id']; state=v.get('attributes',{}).get('appVersionState') or v.get('attributes',{}).get('appStoreState')
          locs=req('GET',f'/appStoreVersions/{vid}/appStoreVersionLocalizations',{'filter[locale]':LOCALE,'limit':'50'})['data']
          if len(locs)!=1: raise SystemExit(f'Expected one en-US version localization, found {len(locs)}')
          vl=locs[0]; va={'description':read('fastlane/metadata/en-US/description.txt'),'keywords':read('fastlane/metadata/en-US/keywords.txt'),'marketingUrl':read('fastlane/metadata/en-US/marketing_url.txt'),'promotionalText':read('fastlane/metadata/en-US/promotional_text.txt'),'supportUrl':read('fastlane/metadata/en-US/support_url.txt')}
          req('PATCH',f'/appStoreVersionLocalizations/{vl["id"]}',payload={'data':{'type':'appStoreVersionLocalizations','id':vl['id'],'attributes':va}})
          cp=read('fastlane/metadata/copyright.txt'); req('PATCH',f'/appStoreVersions/{vid}',payload={'data':{'type':'appStoreVersions','id':vid,'attributes':{'copyright':cp}}})
          infos=req('GET',f'/apps/{app_id}/appInfos',{'limit':'200'})['data']; candidates=[i for i in infos if (i.get('attributes',{}).get('state') or i.get('attributes',{}).get('appStoreState')) in {'REJECTED','DEVELOPER_REJECTED','METADATA_REJECTED','PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW'}]
          if len(candidates)!=1: raise SystemExit(f'Expected one editable/rejected appInfo, found {len(candidates)}')
          info=candidates[0]; il=req('GET',f'/appInfos/{info["id"]}/appInfoLocalizations',{'filter[locale]':LOCALE,'limit':'50'})['data']
          if len(il)!=1: raise SystemExit(f'Expected one en-US appInfo localization, found {len(il)}')
          il=il[0]; ia={'name':read('fastlane/metadata/en-US/name.txt'),'subtitle':read('fastlane/metadata/en-US/subtitle.txt'),'privacyPolicyUrl':read('fastlane/metadata/en-US/privacy_url.txt'),'privacyChoicesUrl':read('fastlane/metadata/en-US/support_url.txt')}
          req('PATCH',f'/appInfoLocalizations/{il["id"]}',payload={'data':{'type':'appInfoLocalizations','id':il['id'],'attributes':ia}})
          vr=req('GET',f'/appStoreVersionLocalizations/{vl["id"]}')['data']['attributes']; ir=req('GET',f'/appInfoLocalizations/{il["id"]}')['data']['attributes']; ver=req('GET',f'/appStoreVersions/{vid}')['data']['attributes']
          bad=[f'version.{k}' for k,val in va.items() if vr.get(k)!=val]+[f'appInfo.{k}' for k,val in ia.items() if ir.get(k)!=val]
          if ver.get('copyright')!=cp: bad.append('copyright')
          if bad: raise SystemExit(f'Metadata verification mismatch: {bad}')
          ev={'bundleId':BUNDLE,'appId':app_id,'version':VERSION,'versionId':vid,'state':state,'verified':True,'fields':sorted(list(va)+list(ia)+['copyright']),'omittedFirstReleaseField':'whatsNew'}
          out=Path(os.environ['RUNNER_TEMP'])/'good-times-metadata-v4.json'; out.write_text(json.dumps(ev,indent=2),encoding='utf-8'); print(json.dumps(ev,indent=2))
          PY
      - name: Preserve metadata evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOOD-TIMES-metadata-v4-${{ github.run_number }}
          path: ${{ runner.temp }}/good-times-metadata-v4.json
          if-no-files-found: ignore
