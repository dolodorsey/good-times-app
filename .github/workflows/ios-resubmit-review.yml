name: GOOD TIMES Resubmit App Review

on:
  workflow_dispatch:
    inputs:
      version:
        description: App Store version to submit (for example 1.1.0)
        required: true
        type: string
      build:
        description: Exact App Store Connect build number to submit
        required: true
        type: string
      confirmation:
        description: Type RESUBMIT to confirm this writes to App Store Connect
        required: true
        type: string

permissions:
  contents: read

jobs:
  resubmit:
    if: inputs.confirmation == 'RESUBMIT'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check --quiet pyjwt cryptography requests
      - name: Validate and resubmit the explicitly selected GOOD TIMES build
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TARGET_VERSION: ${{ inputs.version }}
          TARGET_BUILD: ${{ inputs.build }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          import jwt, requests

          BASE='https://api.appstoreconnect.apple.com/v1'
          BUNDLE='com.kollective.goodtimes'
          VERSION=os.environ['TARGET_VERSION'].strip()
          BUILD=os.environ['TARGET_BUILD'].strip()
          if not VERSION or not BUILD:
              raise SystemExit('Version and build inputs are required')
          if BUILD == '250':
              raise SystemExit('Build 250 is retired and cannot be resubmitted by this workflow')

          token=jwt.encode({'iss':os.environ['ASC_ISSUER_ID'],'iat':int(time.time()),'exp':int(time.time())+900,'aud':'appstoreconnect-v1'},os.environ['ASC_PRIVATE_KEY'],algorithm='ES256',headers={'kid':os.environ['ASC_KEY_ID'],'typ':'JWT'})
          H={'Authorization':f'Bearer {token}','Content-Type':'application/json'}

          def req(method,path,params=None,payload=None,allow_error=False):
              r=requests.request(method,BASE+path,headers=H,params=params,json=payload,timeout=45)
              if not r.ok and not allow_error:
                  raise SystemExit(f'{method} {path} HTTP {r.status_code}: {r.text[:6000]}')
              if allow_error:
                  return r
              return {} if r.status_code==204 or not r.content else r.json()

          apps=req('GET','/apps',{'filter[bundleId]':BUNDLE,'limit':'10'})['data']
          exact=[a for a in apps if a.get('attributes',{}).get('bundleId')==BUNDLE]
          if len(exact)!=1: raise SystemExit('GOOD TIMES app resolution failed')
          app_id=exact[0]['id']

          versions=req('GET',f'/apps/{app_id}/appStoreVersions',{'limit':'200'})['data']
          vm=[v for v in versions if v.get('attributes',{}).get('platform')=='IOS' and v.get('attributes',{}).get('versionString')==VERSION]
          if len(vm)!=1: raise SystemExit(f'Expected one iOS {VERSION}, found {len(vm)}')
          version=vm[0]
          vid=version['id']
          vstate=version.get('attributes',{}).get('appVersionState') or version.get('attributes',{}).get('appStoreState')
          if vstate not in {'PREPARE_FOR_SUBMISSION','REJECTED','DEVELOPER_REJECTED','METADATA_REJECTED','READY_FOR_REVIEW'}:
              raise SystemExit(f'Unsafe app-version state for resubmission: {vstate}')

          build_rel=req('GET',f'/appStoreVersions/{vid}/relationships/build')['data']
          if not build_rel: raise SystemExit('No build attached to App Store version')
          build=req('GET',f'/builds/{build_rel["id"]}')['data']
          ba=build.get('attributes',{})
          if ba.get('version')!=BUILD:
              raise SystemExit(f'Attached build {ba.get("version")} does not match explicitly requested build {BUILD}')
          if ba.get('processingState')!='VALID' or ba.get('buildAudienceType')!='APP_STORE_ELIGIBLE':
              raise SystemExit(f'Attached build is not App Store eligible: {ba}')

          review=req('GET',f'/appStoreVersions/{vid}/appStoreReviewDetail')['data']
          ra=review.get('attributes',{})
          required=['contactFirstName','contactLastName','contactPhone','contactEmail']
          missing=[k for k in required if not ra.get(k)]
          if missing: raise SystemExit(f'App Review contact details incomplete: {missing}')
          if ra.get('demoAccountRequired') and (not ra.get('demoAccountName') or not ra.get('demoAccountPassword')):
              raise SystemExit('Demo account is required but credentials are incomplete')

          subs=req('GET',f'/apps/{app_id}/reviewSubmissions',{'limit':'200'})['data']
          unresolved=[s for s in subs if s.get('attributes',{}).get('state')=='UNRESOLVED_ISSUES']
          if len(unresolved)!=1: raise SystemExit(f'Expected exactly one UNRESOLVED_ISSUES submission, found {len(unresolved)}')
          sub=unresolved[0]
          sid=sub['id']
          items=req('GET',f'/reviewSubmissions/{sid}/items',{'limit':'200'})['data']
          if len(items)!=1: raise SystemExit(f'Expected one review item, found {len(items)}')

          payload={'data':{'type':'reviewSubmissions','id':sid,'attributes':{'submitted':True}}}
          transient_phrase='Version is not ready to be submitted yet, please try again later.'
          submitted=False
          last_error=None
          for attempt in range(1,13):
              r=req('PATCH',f'/reviewSubmissions/{sid}',payload=payload,allow_error=True)
              if r.ok:
                  submitted=True
                  print(f'App Review resubmission accepted on attempt {attempt}.')
                  break
              last_error=r.text[:6000]
              if r.status_code==409 and transient_phrase in r.text:
                  print(f'App Store state is still propagating (attempt {attempt}/12); retrying in 20 seconds.')
                  time.sleep(20)
                  continue
              raise SystemExit(f'PATCH /reviewSubmissions/{sid} HTTP {r.status_code}: {last_error}')
          if not submitted:
              raise SystemExit(f'App Store version never became review-ready after bounded retries: {last_error}')

          final=req('GET',f'/reviewSubmissions/{sid}')['data']
          fstate=final.get('attributes',{}).get('state')
          if fstate not in {'READY_FOR_REVIEW','WAITING_FOR_REVIEW','IN_REVIEW'}:
              raise SystemExit(f'Resubmission request returned unexpected state {fstate}: {json.dumps(final)[:4000]}')

          evidence={'bundleId':BUNDLE,'appId':app_id,'version':VERSION,'versionId':vid,'build':BUILD,'buildId':build['id'],'reviewSubmissionId':sid,'previousState':'UNRESOLVED_ISSUES','currentState':fstate,'submitted':True,'verified':True}
          out=Path(os.environ['RUNNER_TEMP'])/'good-times-resubmission.json'
          out.write_text(json.dumps(evidence,indent=2),encoding='utf-8')
          print(json.dumps(evidence,indent=2))
          PY
      - name: Preserve resubmission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOOD-TIMES-review-resubmission-${{ github.run_number }}
          path: ${{ runner.temp }}/good-times-resubmission.json
          if-no-files-found: ignore
