name: GOOD TIMES final complete release candidate
on:
  push:
    branches: [release/gt-complete-compact-20260927]
    paths: [scripts/complete-final-edit-once.py, scripts/complete-scoreboard-date-fix.py, .github/workflows/complete-final-check-once.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Commit actual final source before testing
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/gt-complete-compact-20260927 | cut -f1)" = "$GITHUB_SHA"
          python scripts/complete-final-edit-once.py
          python scripts/complete-scoreboard-date-fix.py
          git rm scripts/complete-final-edit-once.py scripts/complete-scoreboard-date-fix.py .github/workflows/complete-final-check-once.yml
          git config user.name 'GOOD TIMES build'
          git config user.email 'good-times-build@users.noreply.github.com'
          git add src api scripts .github/workflows/ui-regression.yml vite.config.js AGENTS.md docs
          git commit -m 'GOOD TIMES: finish full compact release, live sports, protected multi-engine gates and rollback contract'
          mkdir -p ui-artifacts/complete-upgrade
          git rev-parse HEAD > ui-artifacts/complete-upgrade/tested-sha.txt
      - run: npm ci --legacy-peer-deps
      - name: Default production-mode tests and build
        run: npm run build > ui-artifacts/complete-upgrade/build.log 2>&1
      - name: Diagnose registered provider response without credentials or account access
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {sportsLive} from './api/sports-live.js';const r=await sportsLive('/api/sports-live');fs.writeFileSync('ui-artifacts/complete-upgrade/sports-diagnostic.json',JSON.stringify({ok:r.ok,scope:r.scope,items:r.items.length,diagnostics:r.diagnostics},null,2));" > ui-artifacts/complete-upgrade/provider-diagnostic.log 2>&1
      - name: Validate actual public content and registered sports provider
        env:
          GT_UI_QA_SESSION: ${{ secrets.GT_UI_QA_SESSION }}
        run: node scripts/complete-live-read.mjs > ui-artifacts/complete-upgrade/live-read.log 2>&1
      - run: npx --no-install playwright-core install --with-deps chromium webkit
      - name: Complete Chromium acceptance
        env:
          GT_COMPLETE_ARTIFACTS: ui-artifacts/complete-upgrade/chromium
        run: node scripts/complete-upgrade-evidence.mjs > ui-artifacts/complete-upgrade/chromium.log 2>&1
      - name: Complete WebKit acceptance
        env:
          GT_COMPLETE_BROWSER: webkit
          GT_COMPLETE_ARTIFACTS: ui-artifacts/complete-upgrade/webkit
        run: node scripts/complete-upgrade-evidence.mjs > ui-artifacts/complete-upgrade/webkit.log 2>&1
      - name: Publish tested candidate branch, not production
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/gt-complete-compact-20260927 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/release/gt-complete-compact-20260927
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-final-evidence-${{ github.run_id }}
          path: ui-artifacts/complete-upgrade/
          retention-days: 7
