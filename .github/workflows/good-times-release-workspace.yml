name: GOOD TIMES Release Debug Workspace
on:
  push:
    branches: [upgrade/home-discovery-planner-20260925]
    paths: [.github/workflows/good-times-release-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive tracked release source only
        run: |
          mkdir -p /tmp/gt-release-source
          git rev-parse HEAD > /tmp/gt-release-source/source-sha.txt
          git archive --format=tar.gz HEAD -o /tmp/gt-release-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: good-times-release-source
          path: /tmp/gt-release-source/
          retention-days: 3
          if-no-files-found: error
