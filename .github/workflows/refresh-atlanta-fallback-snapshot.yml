name: Refresh Atlanta fallback snapshot

# The embedded Atlanta snapshot (api/atlanta-fallback-snapshot.js) is the
# last-resort customer fallback when PostgREST is unavailable. It expires after
# 36h (api/data-live.js EMBEDDED_SNAPSHOT_MAX_AGE_MS). An expired snapshot means
# a PostgREST stall returns 503 AND fails the release test gate.
#
# main is protected (PR required; required checks: verify, geometry; 0 approvals).
# This workflow therefore never pushes to main: it refreshes on a claude/ branch,
# opens/updates a PR, dispatches the required checks on the exact head SHA,
# waits for them, and squash-merges that exact SHA. Any failure opens an issue.
# Requires repo setting: "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: '17 7,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  issues: write

concurrency:
  group: atlanta-fallback-snapshot-refresh
  cancel-in-progress: false

env:
  BRANCH: claude/atlanta-snapshot-refresh
  GH_TOKEN: ${{ github.token }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Refresh snapshot from canonical cache (validated)
        run: node scripts/refresh-atlanta-fallback-snapshot.mjs
      - name: Data-only diff guard
        id: diff
        run: |
          CHANGED=$(git status --porcelain | awk '{print $2}')
          echo "changed: $CHANGED"
          if [ -z "$CHANGED" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$CHANGED" != "api/atlanta-fallback-snapshot.js" ]; then echo "Refusing: unexpected files changed"; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Full release gate (tests + production build)
        if: steps.diff.outputs.changed == 'true'
        run: npm run build
      - name: Open or update refresh PR
        id: pr
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "good-times-snapshot-bot"
          git config user.email "good-times-snapshot-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add api/atlanta-fallback-snapshot.js
          git commit -m "GOOD TIMES: refresh verified Atlanta fallback snapshot (data-only)"
          git push -f origin "$BRANCH"
          SHA=$(git rev-parse HEAD)
          PR=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "GOOD TIMES: refresh verified Atlanta fallback snapshot (automated, data-only)" \
              --body "Automated by \`refresh-atlanta-fallback-snapshot.yml\`. Only \`api/atlanta-fallback-snapshot.js\` changes. Validated (fresh, service-date match, Atlanta-only, schema, no count collapse) and passed \`npm run build\` (tests + Vite) before opening. Merged by the workflow once required checks pass on this exact SHA."
            PR=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "pr=$PR" >> "$GITHUB_OUTPUT"
      - name: Dispatch required checks on the refresh commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          gh workflow run ui-regression.yml --ref "$BRANCH"
          gh workflow run repair-customer-shell.yml --ref "$BRANCH"
          gh workflow run repair-live-runtime.yml --ref "$BRANCH"
      - name: Wait for required checks, then merge the exact SHA
        if: steps.diff.outputs.changed == 'true'
        env:
          SHA: ${{ steps.pr.outputs.sha }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          for i in $(seq 1 80); do
            RUNS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              -q '[.check_runs[] | select(.name=="verify" or .name=="geometry") | {name, status, conclusion}]')
            OK=$(echo "$RUNS" | jq '[.[]|select(.name=="geometry" and .conclusion=="success")]|length>0 and ([.[]|select(.name=="verify")]|length>0) and ([.[]|select(.name=="verify" and .status!="completed")]|length==0) and ([.[]|select(.name=="verify" and .conclusion!="success" and .conclusion!="skipped")]|length==0)')
            BAD=$(echo "$RUNS" | jq '[.[]|select(.status=="completed" and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out"))]|length')
            echo "$(date -u +%T) ok=$OK bad=$BAD runs=$RUNS"
            if [ "$BAD" != "0" ]; then echo "Required check failed"; exit 1; fi
            if [ "$OK" = "true" ]; then break; fi
            if [ "$i" = "80" ]; then echo "Timed out waiting for required checks"; exit 1; fi
            sleep 30
          done
          gh pr merge "$PR" --squash --match-head-commit "$SHA"
      - name: Report failure
        if: failure()
        run: |
          TITLE="Atlanta fallback snapshot refresh failed"
          BODY="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — the embedded fallback expires 36h after its last refresh. Check /api/health fallback_snapshot_armed / fallback_snapshot_age_hours."
          N=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
