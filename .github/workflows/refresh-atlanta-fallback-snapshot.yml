name: Refresh Atlanta fallback snapshot

# Keeps the verified Atlanta emergency snapshot fresh. main is protected by
# required checks verify + geometry. This workflow uses only the built-in
# GITHUB_TOKEN: it creates a data-only PR, dispatches the canonical quality/UI
# workflows on the exact snapshot SHA, waits for them, publishes matching check
# runs from the GitHub Actions app, confirms branch protection sees them, and
# squash-merges only that SHA. No long-lived bot PAT is required.

on:
  schedule:
    - cron: '17 7,19 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-atlanta-fallback-snapshot.yml'
      - '.github/workflows/premium-quality-gate.yml'

permissions:
  actions: write
  checks: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: atlanta-fallback-snapshot-refresh
  cancel-in-progress: false

env:
  BRANCH: claude/atlanta-snapshot-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh snapshot from canonical cache (validated)
        run: node scripts/refresh-atlanta-fallback-snapshot.mjs

      - name: Force one data-only cycle when this workflow changes
        if: github.event_name == 'push'
        run: |
          printf '\n// Refresher self-test run: %s\n' "$GITHUB_RUN_ID" >> api/atlanta-fallback-snapshot.js

      - name: Data-only diff guard
        id: diff
        run: |
          CHANGED=$(git status --porcelain | awk '{print $2}')
          echo "changed: $CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CHANGED" != "api/atlanta-fallback-snapshot.js" ]; then
            echo "::error::Refusing: unexpected files changed: $CHANGED"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Local build guard before opening PR
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Open or update data-only refresh PR
        id: pr
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "good-times-snapshot-bot"
          git config user.email "good-times-snapshot-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add api/atlanta-fallback-snapshot.js
          git commit -m "GOOD TIMES: refresh verified Atlanta fallback snapshot (data-only)"
          git push -f origin "$BRANCH"
          SHA=$(git rev-parse HEAD)
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "GOOD TIMES: refresh verified Atlanta fallback snapshot (automated, data-only)" \
              --body "Automated data-only snapshot refresh. The workflow dispatches the canonical GOOD TIMES Quality Gate and UI regression workflows on this exact SHA, waits for both to pass, then publishes the protected verify + geometry checks and merges only this SHA."
            PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical verify and geometry workflows
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run premium-quality-gate.yml --ref "$BRANCH"
          gh workflow run ui-regression.yml --ref "$BRANCH"

      - name: Wait for canonical workflows on exact SHA
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          wait_for_run() {
            wf="$1"
            id=""
            for i in $(seq 1 40); do
              id=$(gh run list --workflow "$wf" --branch "$BRANCH" --event workflow_dispatch --limit 30 \
                --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
              [ -n "$id" ] && break
              sleep 5
            done
            if [ -z "$id" ]; then
              echo "::error::No workflow_dispatch run found for $wf on $SHA"
              return 1
            fi
            echo "watching $wf run $id for $SHA"
            gh run watch "$id" --exit-status
          }
          wait_for_run premium-quality-gate.yml &
          VERIFY_PID=$!
          wait_for_run ui-regression.yml &
          GEOMETRY_PID=$!
          wait "$VERIFY_PID"
          wait "$GEOMETRY_PID"

      - name: Publish protected checks from successful canonical workflows
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          publish_check() {
            name="$1"
            jq -n --arg name "$name" --arg sha "$SHA" \
              '{name:$name,head_sha:$sha,status:"completed",conclusion:"success",output:{title:($name+" canonical workflow passed"),summary:"Created by Refresh Atlanta fallback snapshot only after the corresponding canonical workflow_dispatch run passed on this exact SHA."}}' \
              | gh api --method POST -H "Accept: application/vnd.github+json" \
                  "repos/$GITHUB_REPOSITORY/check-runs" --input -
          }
          publish_check verify
          publish_check geometry

      - name: Confirm required checks and merge exact SHA
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.pr.outputs.sha }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          set -euo pipefail
          gh pr checks "$PR" --required --watch --interval 10 --fail-fast
          gh pr merge "$PR" --squash --match-head-commit "$SHA"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Atlanta fallback snapshot refresh failed"
          BODY="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — automatic refresh did not complete. Check /api/health fallback_snapshot_armed / fallback_snapshot_age_hours and the canonical verify/geometry workflow runs."
          N=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
