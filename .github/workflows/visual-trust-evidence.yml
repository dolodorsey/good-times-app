name: GOOD TIMES visual trust evidence
on:
  push:
    branches: [fix/good-times-visual-trust-20260914]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: good-times-visual-trust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Capture source without credentials
        run: |
          mkdir -p visual-trust-evidence
          git rev-parse HEAD > visual-trust-evidence/source-sha.txt
          git archive --format=tar HEAD > visual-trust-evidence/source.tar
          tar -czf visual-trust-evidence/dependencies.tgz node_modules
      - name: Capture current production without mutation
        env:
          GT_UI_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright-core';
          import fs from 'node:fs';
          const browser=await chromium.launch({executablePath:process.env.GT_UI_CHROME_PATH,headless:true,args:['--no-sandbox']});
          for(const width of [390,430,834]){
            const context=await browser.newContext({viewport:{width,height:width===834?1194:844},deviceScaleFactor:1});
            await context.addInitScript(()=>{sessionStorage.setItem('gt_premium_launch','1');sessionStorage.setItem('gt_splash_shown','1')});
            const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://thegoodtimesworldwide.com',{waitUntil:'domcontentloaded'});
            await page.locator('.gt5-app').waitFor({timeout:45000});
            for(const screen of ['Home','Discover','Plan','Saved','Profile']){
              await page.locator('.gt5-nav button').filter({hasText:screen}).click();
              await page.waitForTimeout(1200);
              await page.screenshot({path:`visual-trust-evidence/live-${width}-${screen.toLowerCase()}.png`});
            }
            fs.writeFileSync(`visual-trust-evidence/live-${width}-errors.json`,JSON.stringify(errors));
            await context.close();
          }
          for(const endpoint of ['health','data-fast?city=atlanta&limit=100']){
            const response=await fetch(`https://thegoodtimesworldwide.com/api/${endpoint}`);
            fs.writeFileSync(`visual-trust-evidence/${endpoint.startsWith('health')?'health':'inventory'}.json`,await response.text());
          }
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: good-times-visual-trust-${{ github.sha }}
          path: visual-trust-evidence
          retention-days: 14
