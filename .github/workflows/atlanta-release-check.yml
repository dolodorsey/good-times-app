name: Atlanta Intelligence Release Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/atlanta-intelligence-release-2026-07-30
      - agent/good-times-completion

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Atlanta release contract
        run: node scripts/verify-atlanta-release.mjs

      - name: Build application
        run: npm run build

      - name: Verify stabilized runtime is in build output
        run: |
          test -f dist/gt-timezone-guard.js
          test -f dist/gt-stabilizer.js
          grep -q 'gt-timezone-guard.js' dist/index.html
          grep -q 'gt-stabilizer.js' dist/index.html
          grep -q 'stale-fallback' dist/gt-stabilizer.js
