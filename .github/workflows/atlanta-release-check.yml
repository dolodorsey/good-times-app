name: Atlanta Intelligence Release Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/atlanta-intelligence-release-2026-07-30

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Atlanta release contract
        run: node scripts/verify-atlanta-release.mjs

      - name: Build application
        run: npm run build

      - name: Verify runtime is in build output
        run: |
          test -f dist/gt-runtime.js
          grep -q 'v_gt_atlanta_ranked_feed' dist/gt-runtime.js
          grep -q 'gt-runtime.js' dist/index.html
