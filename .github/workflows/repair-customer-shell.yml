name: Verify Customer App Shell

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Verify customer navigation contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const source=fs.readFileSync('src/App.jsx','utf8')
          const required=['Now','Explore','Build My Night','Dates','Vault']
          const missing=required.filter(label=>!source.includes(label))
          if(missing.length){
            console.error(`Missing customer shell labels: ${missing.join(', ')}`)
            process.exit(1)
          }
          console.log('GOOD TIMES legacy customer shell navigation contract is present.')
          NODE
      - name: Verify tests
        run: npm run test
      - name: Verify production build
        run: npm run build
