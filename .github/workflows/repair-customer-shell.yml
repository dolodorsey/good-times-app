name: Repair Customer App Shell

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply fixed-shell and feature restoration
        run: node scripts/repair-customer-shell.mjs
      - name: Verify production build
        run: npm install --legacy-peer-deps && npm run build
      - name: Commit verified repair
        run: |
          if git diff --quiet; then
            echo "No generated changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Restore fixed navigation, Explore, and Build My Night"
          git push
