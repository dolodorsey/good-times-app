name: GOOD TIMES Store Readiness Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-store-readiness-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check --quiet pyjwt cryptography requests
      - name: Audit localization and screenshot readiness
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          import jwt, requests
          BASE='https://api.appstoreconnect.apple.com/v1'; BUNDLE='com.kollective.goodtimes'; VERSION='1.1.0'
          token=jwt.encode({'iss':os.environ['ASC_ISSUER_ID'],'iat':int(time.time()),'exp':int(time.time())+900,'aud':'appstoreconnect-v1'},os.environ['ASC_PRIVATE_KEY'],algorithm='ES256',headers={'kid':os.environ['ASC_KEY_ID'],'typ':'JWT'})
          H={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def get(path,params=None,allow_404=False):
              r=requests.get(BASE+path,headers=H,params=params,timeout=45)
              if allow_404 and r.status_code==404: return None
              if not r.ok: raise SystemExit(f'GET {path} HTTP {r.status_code}: {r.text[:5000]}')
              return r.json()
          apps=get('/apps',{'filter[bundleId]':BUNDLE,'limit':'10'})['data']; exact=[a for a in apps if a.get('attributes',{}).get('bundleId')==BUNDLE]
          if len(exact)!=1: raise SystemExit('GOOD TIMES app resolution failed')
          app_id=exact[0]['id']; versions=get(f'/apps/{app_id}/appStoreVersions',{'limit':'200'})['data']; vm=[v for v in versions if v.get('attributes',{}).get('platform')=='IOS' and v.get('attributes',{}).get('versionString')==VERSION]
          if len(vm)!=1: raise SystemExit(f'Expected one iOS {VERSION}, found {len(vm)}')
          v=vm[0]; vid=v['id']
          vlocs=get(f'/appStoreVersions/{vid}/appStoreVersionLocalizations',{'limit':'200'})['data']
          infos=get(f'/apps/{app_id}/appInfos',{'limit':'200'})['data']; editable=[i for i in infos if (i.get('attributes',{}).get('state') or i.get('attributes',{}).get('appStoreState')) in {'REJECTED','DEVELOPER_REJECTED','METADATA_REJECTED','PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW'}]
          info=editable[0] if editable else (infos[0] if infos else None)
          ilocs=get(f'/appInfos/{info["id"]}/appInfoLocalizations',{'limit':'200'})['data'] if info else []
          screenshots=[]
          for loc in vlocs:
              sets=get(f'/appStoreVersionLocalizations/{loc["id"]}/appScreenshotSets',{'limit':'200'})['data']
              loc_sets=[]
              for ss in sets:
                  shots=get(f'/appScreenshotSets/{ss["id"]}/appScreenshots',{'limit':'200'})['data']
                  loc_sets.append({'id':ss['id'],'displayType':ss.get('attributes',{}).get('screenshotDisplayType'),'count':len(shots),'screenshots':[{'id':s['id'],'fileName':s.get('attributes',{}).get('fileName'),'assetDeliveryState':s.get('attributes',{}).get('assetDeliveryState')} for s in shots]})
              screenshots.append({'locale':loc.get('attributes',{}).get('locale'),'localizationId':loc['id'],'sets':loc_sets})
          build_rel=get(f'/appStoreVersions/{vid}/relationships/build',allow_404=True)
          evidence={'appId':app_id,'versionId':vid,'versionState':v.get('attributes',{}).get('appVersionState') or v.get('attributes',{}).get('appStoreState'),'versionLocales':[l.get('attributes',{}).get('locale') for l in vlocs],'appInfoLocales':[l.get('attributes',{}).get('locale') for l in ilocs],'localeParity':sorted([l.get('attributes',{}).get('locale') for l in vlocs])==sorted([l.get('attributes',{}).get('locale') for l in ilocs]),'screenshots':screenshots,'hasAttachedBuild':bool(build_rel and build_rel.get('data'))}
          out=Path(os.environ['RUNNER_TEMP'])/'good-times-store-readiness.json'; out.write_text(json.dumps(evidence,indent=2),encoding='utf-8'); print(json.dumps(evidence,indent=2))
          PY
      - name: Preserve readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: GOOD-TIMES-store-readiness-${{ github.run_number }}
          path: ${{ runner.temp }}/good-times-store-readiness.json
          if-no-files-found: error
