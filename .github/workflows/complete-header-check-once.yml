name: GOOD TIMES complete candidate public contract check
on:
  push:
    branches: [release/gt-complete-compact-20260927]
    paths: [scripts/complete-header-edit-once.py, .github/workflows/complete-header-check-once.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Commit actual header changes before validation
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/gt-complete-compact-20260927 | cut -f1)" = "$GITHUB_SHA"
          python scripts/complete-header-edit-once.py
          git rm scripts/complete-header-edit-once.py .github/workflows/complete-header-check-once.yml
          git config user.name 'GOOD TIMES build'
          git config user.email 'good-times-build@users.noreply.github.com'
          git add src api
          git commit -m 'GOOD TIMES: integrate current publishable-key contract throughout full compact content reads'
          mkdir -p ui-artifacts/complete-upgrade
          git rev-parse HEAD > ui-artifacts/complete-upgrade/tested-sha.txt
      - run: npm ci --legacy-peer-deps
      - name: Exact candidate unit tests and complete build
        env:
          GT_COMPLETE_UPGRADE: '1'
        run: npm run build > ui-artifacts/complete-upgrade/build.log 2>&1
      - name: Read actual public collections and check configured QA identity
        env:
          GT_UI_QA_SESSION: ${{ secrets.GT_UI_QA_SESSION }}
        run: node scripts/complete-live-read.mjs > ui-artifacts/complete-upgrade/live-read.log 2>&1
      - run: npx --no-install playwright-core install --with-deps chromium
      - name: Recheck all compact screen journeys
        run: node scripts/complete-upgrade-evidence.mjs > ui-artifacts/complete-upgrade/browser.log 2>&1
      - name: Publish validated candidate to development branch only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/gt-complete-compact-20260927 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/release/gt-complete-compact-20260927
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-contract-evidence-${{ github.run_id }}
          path: ui-artifacts/complete-upgrade/
          retention-days: 7
