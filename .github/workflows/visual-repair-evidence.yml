name: GOOD TIMES visual repair evidence
on:
  push:
    branches: [fix/approved-visual-parity-20260914]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: good-times-visual-repair
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Create reproducible source bundle without credentials
        run: |
          mkdir -p repair-evidence
          git rev-parse HEAD > repair-evidence/source-sha.txt
          git archive --format=tar HEAD > repair-evidence/source.tar
          tar -czf repair-evidence/dependencies.tgz node_modules
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Capture actual production, all five destinations, no form submissions
        env:
          GT_UI_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          cat > /tmp/capture-repair.mjs <<'JS'
          import {createRequire} from 'node:module';
          import fs from 'node:fs';
          const require=createRequire(process.cwd()+'/package.json');
          const {chromium}=require('playwright-core');
          const browser=await chromium.launch({executablePath:process.env.GT_UI_CHROME_PATH,headless:true,args:['--no-sandbox']});
          for(const vp of [{width:390,height:844},{width:430,height:932},{width:834,height:1194}]){
            const ctx=await browser.newContext({viewport:vp,deviceScaleFactor:1});
            const page=await ctx.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://thegoodtimesworldwide.com',{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('.gt5-app').waitFor({timeout:45000});
            await page.waitForTimeout(4000);
            for(const [tab,selector] of [['Home','.gt5-home-hero'],['Discover','.gt5-discover'],['Plan','.gt5-plan'],['Saved','.gt5-saved'],['Profile','.gt5-profile']]){
              await page.locator('.gt5-nav button').filter({hasText:tab}).click();
              await page.locator(selector).waitFor({timeout:10000});
              await page.waitForTimeout(1500);
              await page.screenshot({path:`repair-evidence/before-${vp.width}-${tab.toLowerCase()}.png`});
            }
            fs.writeFileSync(`repair-evidence/before-${vp.width}-errors.json`,JSON.stringify(errors,null,2));
            await ctx.close();
          }
          await browser.close();
          JS
          node /tmp/capture-repair.mjs
      - name: Read existing GOOD TIMES creative candidates and public inventory
        run: |
          python - <<'PY'
          import urllib.request,json,pathlib
          root=pathlib.Path('repair-evidence'); (root/'existing-assets').mkdir(exist_ok=True)
          base='https://dzlmtvodpyhetvektfuo.supabase.co/storage/v1/object/public/brand-graphics/'
          names=['good_times/atl-nightlife-elevated.png','good_times/atl-ponce-city-skyline.png','good_times/atl-rooftop-lounge.png']
          for name in names:
            try: urllib.request.urlretrieve(base+name,root/'existing-assets'/name.rsplit('/',1)[-1])
            except Exception as e: print(name,str(e))
          with urllib.request.urlopen('https://thegoodtimesworldwide.com/api/data-fast?city=atlanta&limit=300',timeout=60) as r:
            (root/'public-inventory.json').write_bytes(r.read())
          PY
      - name: Build and capture candidate when repair script exists
        env:
          GT_UI_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          if [ -f scripts/visual-acceptance.mjs ]; then
            npm run build
            GT_UI_HEALTH_FIXTURE=healthy node scripts/serve-dist.mjs &
            for i in $(seq 1 30); do curl -sf http://localhost:4180/ >/dev/null && break; sleep 1; done
            GT_UI_BASE=http://localhost:4180 GT_UI_ARTIFACTS=repair-evidence/after node scripts/visual-acceptance.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: good-times-visual-repair-${{ github.sha }}
          path: repair-evidence
          retention-days: 14
