name: Good Times dependency lock refresh

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/good-times-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh vulnerable transitive packages in lockfile only
        run: npm audit fix --package-lock-only --audit-level=high
      - name: Verify exact refreshed lock installs
        run: npm ci
      - name: Require zero high or critical dependency findings
        run: npm audit --audit-level=high
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: good-times-refreshed-package-lock
          path: package-lock.json
          retention-days: 1
