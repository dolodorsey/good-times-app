name: GOOD TIMES lock refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'automation/good-times-outage-containment-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile from GOOD TIMES package contract
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile only when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security(good-times): regenerate lockfile for patched xmldom"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
