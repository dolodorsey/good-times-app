name: Good Times dependency lock refresh

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/good-times-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh vulnerable transitive packages in lockfile only
        run: npm audit fix --package-lock-only --audit-level=high
      - name: Verify exact refreshed lock installs
        run: npm ci
      - name: Require zero high or critical dependency findings
        run: npm audit --audit-level=high
      - name: Commit refreshed lockfile back to this remediation branch
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Patch Good Times vulnerable transitive dependency'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: good-times-refreshed-package-lock
          path: package-lock.json
          retention-days: 1
