name: Secret Leak Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact historical exceptions
        id: exceptions
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          python3 scripts/validate-secret-exceptions.py

      - name: Install checksum-verified Gitleaks 8.24.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gt-gitleaks"
          cd "$RUNNER_TEMP/gt-gitleaks"
          BASE=https://github.com/gitleaks/gitleaks/releases/download/v8.24.3
          curl --fail --silent --show-error --location --retry 2 "$BASE/gitleaks_8.24.3_linux_x64.tar.gz" -o gitleaks_8.24.3_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 2 "$BASE/gitleaks_8.24.3_checksums.txt" -o checksums.txt
          grep ' gitleaks_8.24.3_linux_x64.tar.gz$' checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
          echo "$RUNNER_TEMP/gt-gitleaks" >> "$GITHUB_PATH"

      - name: Scan complete history on every event
        id: history
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect --redact=100 --no-banner --exit-code=2 --report-format=json \
            --report-path="$RUNNER_TEMP/gt-gitleaks-results.json" --log-opts="--full-history --all"

      - name: Safe remaining-finding metadata
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'gt-gitleaks-results.json')
          if not os.path.exists(p):
              print('No Gitleaks report file.')
          else:
              rows=json.load(open(p))
              print(json.dumps([{
                  'fingerprint':r.get('Fingerprint'),
                  'file':r.get('File'),
                  'line':r.get('StartLine'),
                  'rule':r.get('RuleID'),
                  'commit':r.get('Commit')
              } for r in rows],indent=2))
          PY

      - name: Record gate result
        if: always()
        env:
          GATE_STATUS: ${{ job.status }}
          EXCEPTION_STATUS: ${{ steps.exceptions.outcome }}
          HISTORY_STATUS: ${{ steps.history.outcome }}
        run: |
          echo "## GOOD TIMES Secret Leak Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Job: $GATE_STATUS; exception validation: $EXCEPTION_STATUS; full-history scan: $HISTORY_STATUS." >> "$GITHUB_STEP_SUMMARY"
          echo "All exceptions are immutable fingerprints; one privileged exception is permitted only after verified credential retirement." >> "$GITHUB_STEP_SUMMARY"
