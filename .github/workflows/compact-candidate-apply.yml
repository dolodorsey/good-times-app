name: Apply Compact Preview Candidate
on:
  push:
    branches: [feat/compact-two-column-pilot-20260927]
    paths: [.github/workflows/compact-candidate-apply.yml]
permissions:
  contents: write
concurrency:
  group: compact-candidate-writer
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/compact-two-column-pilot-20260927' && github.actor == 'dolodorsey'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply asserted existing-app integration only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(text,old,new):
              assert text.count(old)==1,old[:100]
              return text.replace(old,new,1)
          p=Path('src/features/experience/GoodTimesCommandAppV4.jsx');s=p.read_text()
          assert "import { COMPACT_PILOT }" not in s
          s="import { COMPACT_PILOT } from './compact-pilot-flag.js'\nimport CompactVenueCard from './CompactVenueCard.jsx'\n"+s
          s=replace_once(s,'return <div className="gt5-app" data-screen={tab}>',"return <div className={`gt5-app ${COMPACT_PILOT ? 'gt5-compact-pilot' : ''}`} data-screen={tab} data-compact-pilot={COMPACT_PILOT ? 'preview' : undefined}>")
          pos=s.index('const goTab=');end=s.index('\n',pos)
          line=replace_once(s[pos:end],'setTab(id);',"setTab(id);if(COMPACT_PILOT&&id==='discover'){setQuery('');setIntent('');setSelectedCategory(null);setSelectedSubcategory(null);setDirectoryOpen(false);setMapMode(false)}")
          s=s[:pos]+line+s[end:]
          a=s.index("{tab==='discover' &&");b=s.index("{tab==='plan'&&",a)
          legacy=s[a:b].strip();assert legacy.endswith('</section>}')
          legacy_section=legacy[len("{tab==='discover' &&"): -1]
          compact='''<section className="gt5-screen gt5-discover">
                  <div className="gt-compact-discover-title"><h1>Discover Atlanta</h1><p>Find a place. Make a plan.</p></div>
                  <div className="gt5-discover-search gt-compact-search"><GoodTimesIcon glyph="⌕"/><input aria-label="Search Atlanta places" value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search places, neighborhoods…"/>{query&&<button aria-label="Clear search" onClick={()=>setQuery('')}>×</button>}</div>
                  <section className="gt5-taxonomy"><ExploreTaxonomyBrowser compact externalSearch taxonomy={taxonomy} directory={venues} cityName={cityLabel(city)} query={query} onQuery={setQuery} selectedCategory={selectedCategory} selectedSubcategory={selectedSubcategory} onCategory={setSelectedCategory} onSubcategory={setSelectedSubcategory} directoryOpen={directoryOpen} onDirectoryOpen={setDirectoryOpen} mapMode={mapMode} onMapMode={setMapMode} renderVenue={venue=><CompactVenueCard key={venue.id} venue={venue} saved={savedKeys.has(`venue:${venue.id}`)} onOpen={()=>openVenue(venue)} onSave={()=>toggleSave('venue',venue.id)}/>}/></section>
                </section>'''
          s=s[:a]+"{tab==='discover' && (COMPACT_PILOT ? "+compact+" : ("+legacy_section+"))}\n\n      "+s[b:]
          start=s.index('<div className="gt5-home-quick">');end=s.index('</div>',start)+len('</div>')
          s=s[:start]+'{!COMPACT_PILOT&&('+s[start:end]+')}'+s[end:]
          needle='<h1>{selectedVenue.name}</h1>'
          s=replace_once(s,needle,needle+'''{COMPACT_PILOT&&<div className="gt-compact-detail-quick"><button onClick={()=>toggleSave('venue',selectedVenue.id)}>{savedKeys.has(`venue:${selectedVenue.id}`)?'Saved ✓':'Save place'}</button><button className="primary" onClick={()=>{const p=`Plan a complete night that includes ${selectedVenue.name} in ${selectedVenue.neighborhood||cityLabel(city)}.`;setSelectedVenue(null);goTab('plan');setConciergeText(p)}}>Plan a night here ↗</button></div>}''')
          p.write_text(s)
          p=Path('src/features/experience/ExploreTaxonomyBrowser.jsx');s=p.read_text()
          s="import CompactExplorePanel from './CompactExplorePanel.jsx'\n"+replace_once(s,'export default function ExploreTaxonomyBrowser({','function LegacyExploreTaxonomyBrowser({')
          s+='\n/** Owner-approved compact variant; legacy behavior stays untouched off-flag. */\nexport default function ExploreTaxonomyBrowser(props) {\n  return props.compact ? <CompactExplorePanel {...props} /> : <LegacyExploreTaxonomyBrowser {...props} />\n}\n'
          p.write_text(s)
          p=Path('src/features/intelligence/client.js');s=p.read_text()
          s="import { requestExplorePage } from './explore-page.js'\n"+s
          insert="/** Bounded full-corpus place search, separate from Home inventory. */\nexport function loadExplorePage(city = 'atlanta', options = {}, request = {}) {\n  return requestExplorePage(KHG_SUPABASE_URL, gatewayHeaders, { ...options, city: normalizeCity(city) }, request)\n}\n\n"
          s=replace_once(s,'export async function loadGoodTimesProfile(',insert+'export async function loadGoodTimesProfile(')
          a=s.index('export async function unsaveItem');b=s.index('export async function loadItineraries',a)
          portion=replace_once(s[a:b],').catch(() => null)',')');s=s[:a]+portion+s[b:];p.write_text(s)
          p=Path('vite.config.js');s=p.read_text();s=replace_once(s,'  plugins: [react()],',"  plugins: [react()],\n  define: {\n    __GT_COMPACT_PILOT__: JSON.stringify(process.env.VERCEL_ENV !== 'production' && (process.env.GT_COMPACT_PILOT === '1' || (process.env.VERCEL_ENV === 'preview' && process.env.VERCEL_GIT_COMMIT_REF === 'feat/compact-two-column-pilot-20260927'))),\n  },");p.write_text(s)
          p=Path('src/features/experience/good-times-founder-v4-restore.css');s=p.read_text();assert 'good-times-compact-pilot.css' not in s;p.write_text("@import './good-times-compact-pilot.css';\n"+s)
          doc=Path('docs/GOOD_TIMES_COMPACT_PILOT_2026-09-27.md')
          doc.write_text('''# GOOD TIMES compact pilot — owner amendment, 2026-09-27
          
          Dr. Dorsey approved separate two-column previews, the enhanced execution plan, and implementation with Go. This is the preview-only Nightlife vertical slice in the existing canonical V4 app. Browser review precedes production promotion and broad propagation.
          
          ## Approved changes
          Compact two-column categories, subcategories and truthful venue cards; independent Save; compact Discover search; collapsed subcategory choices with Change after selection; no large decorative Discover hero or broad All–Experiences strip. Remove Home Restaurants–This Week shortcuts only in the preview variant. Preserve every taxonomy identity, parent, order, empty lane, Directory/Map, account record, saved plan, detail return and five-tab navigation.
          
          ## Data boundaries
          Existing eligible taxonomy view; 24 membership rows per bounded request; quality/name/ID keyset cursor; deduplicated venue identities. Query-scoped unique totals remain unknown when unavailable. This does not provide a cross-request database snapshot. This pilot is explicitly PLACE search. Full event search and canonical Tonight repairs remain open. Preserve the current clock, do not silently install the proposed evening policy. The Clubs live read contains media, coordinates and classification gaps still requiring review.
          
          Failed reads expose Retry instead of false zero results. Top-level Discover reentry resets discovery state; detail Back retains it. Unsave failure must not be acknowledged as success. Map describes coordinates on loaded records and does not invent customer location. Plan action prefills the existing planner only; it is not a generated or confirmed booking.
          
          ## Isolation and evidence
          Compile-time preview flag; always disabled for VERCEL_ENV=production. No URL or localStorage can enable it. Preserve final eager founder stylesheet and all existing required tests. Separate loopback fixture tests from live account/provider tests. Missing images are honest fallback, not invented venue photos. No database writes, production promotion, subscriptions, actual reservations, marketing sends, source scheduling changes or reactivation of paused jobs. Branch/PR CI has no schedule. Production verification and owner browser approval remain outstanding.
          ''')
          amendment='\n\n## Owner-approved compact pilot — 2026-09-27\nFor the isolated preview pilot, read `docs/GOOD_TIMES_COMPACT_PILOT_2026-09-27.md`. Its compact presentation supersedes oversized hero requirements only within the compiled pilot; all taxonomy, truth, privacy, release and paused-scheduler protections remain binding.\n'
          for name in ['AGENTS.md','src/features/experience/AGENTS.md','docs/GOOD_TIMES_PRODUCT_UI_CONSTITUTION.md','docs/GOOD_TIMES_SCREEN_CONTRACTS.md']:
              p=Path(name);p.write_text(p.read_text()+amendment)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify complete code before branch write
        run: |
          npm ci --legacy-peer-deps
          GT_COMPACT_PILOT=1 npm run build
      - name: Commit tested integration and remove temporary transport files
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/compact-two-column-pilot-20260927'
          git config user.name 'GOOD TIMES preview builder'
          git config user.email 'good-times-preview@users.noreply.github.com'
          git add AGENTS.md docs/GOOD_TIMES_COMPACT_PILOT_2026-09-27.md docs/GOOD_TIMES_PRODUCT_UI_CONSTITUTION.md docs/GOOD_TIMES_SCREEN_CONTRACTS.md src/features/experience/AGENTS.md src/features/experience/ExploreTaxonomyBrowser.jsx src/features/experience/GoodTimesCommandAppV4.jsx src/features/experience/good-times-founder-v4-restore.css src/features/intelligence/client.js vite.config.js
          git rm --ignore-unmatch scripts/.compact-pilot-candidate.json scripts/.compact-candidate-part-0.b64 scripts/.compact-candidate-part-1.b64 scripts/.compact-candidate-part-2.b64 scripts/.compact-candidate-part-3.b64 .github/workflows/compact-candidate-apply.yml
          git commit -m 'GOOD TIMES: integrate approved compact Nightlife pilot in existing app; production remains off'
          git push origin HEAD:refs/heads/feat/compact-two-column-pilot-20260927
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
