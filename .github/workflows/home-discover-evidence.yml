name: GOOD TIMES Home Discover evidence
on:
  push:
    branches: [fix/good-times-home-discover-20260914]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: good-times-home-discover-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read existing GOOD TIMES brand artwork
        run: |
          mkdir -p home-discover-evidence/media
          git rev-parse HEAD > home-discover-evidence/source-sha.txt
          git archive --format=tar HEAD > home-discover-evidence/source.tar
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const root='https://dzlmtvodpyhetvektfuo.supabase.co/storage/v1/object/public/';
          const paths=['good-times-backgrounds/gt-bg-social-scene.webp','good-times-backgrounds/gt-bg-skyline-terrace.webp','good-times-backgrounds/gt-bg-rooftop-lounge.webp','good-times-backgrounds/gt-homescreen-atlanta.webp','brand-graphics/good_times/graphics/GOODTIMES_HOMESCREEN.png','good-times-backgrounds/gt-cat-dining.webp','good-times-backgrounds/gt-cat-nightlife.webp','good-times-backgrounds/gt-cat-music.webp','good-times-backgrounds/gt-bg-waterfront-venue.webp','good-times-backgrounds/gt-cat-adventure.webp'];
          const manifest=[];
          for(const path of paths){
            const r=await fetch(root+path,{signal:AbortSignal.timeout(20000)});
            if(!r.ok||!r.headers.get('content-type')?.startsWith('image/'))throw new Error(`Media read failed: ${path} ${r.status}`);
            const bytes=Buffer.from(await r.arrayBuffer());
            if(bytes.length>15000000)throw new Error('Media exceeds bounded inspection size');
            const name=path.split('/').at(-1);
            fs.writeFileSync('home-discover-evidence/media/'+name,bytes);
            manifest.push({path,name,size:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')});
          }
          fs.writeFileSync('home-discover-evidence/media-manifest.json',JSON.stringify(manifest,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: good-times-home-discover-${{ github.sha }}
          path: home-discover-evidence
          retention-days: 14
          if-no-files-found: error
