<script>

// ═══ TOOLBAR ═══

  {icon:"🌙",l:"Now",href:"https://good-times-app.vercel.app",active:false},

  {icon:"📅",l:"Calendar",href:"https://good-times-app.vercel.app",active:false},
  {icon:"🔒",l:"Vault",href:"https://good-times-app.vercel.app",active:false},

artist:{icon:"🎵",l:"Artist (Music)",desc:"DJs, live performers",color:C.pink,fields:[{n:"full_name",l:"Full Name",t:"text",r:1},{n:"email",l:"Email",t:"email",r:1},{n:"phone",l:"Phone",t:"tel",r:1},{n:"stage",l:"Stage Name",t:"text"},{n:"genre",l:"Genre",t:"select",o:["Hip-Hop","R&B","Afrobeats","Latin","House / EDM","Jazz","Gospel","Indie","Other"]},{n:"link",l:"Spotify / Apple Music",t:"url"},{n:"instagram",l:"Instagram",t:"text"},{n:"bio",l:"Bio",t:"textarea"},{n:"city",l:"City",t:"text"},{n:"set",l:"Set Length",t:"select",o:["15 min","30 min","45 min","1 hour","1.5 hours","2 hours"]},{n:"ref",l:"How Did You Hear?",t:"text"}]},
influencer:{icon:"📸",l:"Influencer",desc:"Content creators & promoters",color:C.purple,fields:[{n:"full_name",l:"Full Name",t:"text",r:1},{n:"email",l:"Email",t:"email",r:1},{n:"phone",l:"Phone",t:"tel",r:1},{n:"instagram",l:"Instagram",t:"text"},{n:"tiktok",l:"TikTok",t:"text"},{n:"followers",l:"Followers",t:"select",o:["1K-5K","5K-10K","10K-25K","25K-50K","50K-100K","100K+"]},{n:"niche",l:"Niche",t:"text"},{n:"city",l:"City",t:"text"},{n:"ref",l:"How Did You Hear?",t:"text"}]},
sponsor:{icon:"💎",l:"Sponsor",desc:"Brand partnerships & activations",color:C.gold,fields:[{n:"full_name",l:"Full Name",t:"text",r:1},{n:"email",l:"Email",t:"email",r:1},{n:"phone",l:"Phone",t:"tel",r:1},{n:"company",l:"Company",t:"text",r:1},{n:"website",l:"Website",t:"url"},{n:"interest",l:"Interest",t:"select",o:["Event Title","Beverage","Activations","Media","Full Season","Custom"]},{n:"budget",l:"Budget",t:"select",o:["$500-$1K","$1K-$2.5K","$2.5K-$5K","$5K-$10K","$10K+"]},{n:"goals",l:"Goals",t:"textarea"},{n:"ref",l:"How Did You Hear?",t:"text"}]},

hiring:{icon:"💼",l:"Hiring",desc:"Join the Good Times team",color:C.green,fields:[{n:"full_name",l:"Full Name",t:"text",r:1},{n:"email",l:"Email",t:"email",r:1},{n:"phone",l:"Phone",t:"tel",r:1},{n:"position",l:"Position",t:"text"},{n:"resume",l:"Resume Link",t:"url"},{n:"exp",l:"Experience",t:"text"},{n:"city",l:"City",t:"text"},{n:"avail",l:"Availability",t:"select",o:["Immediately","2 Weeks","1 Month","Flexible"]},{n:"ref",l:"How Did You Hear?",t:"text"}]},

consult:{icon:"💬",l:"Consultation",desc:"Strategy, events, hospitality",color:C.orange,fields:[{n:"full_name",l:"Full Name",t:"text",r:1},{n:"email",l:"Email",t:"email",r:1},{n:"phone",l:"Phone",t:"tel",r:1},{n:"company",l:"Company",t:"text"},{n:"type",l:"Type",t:"select",o:["Events","Hospitality","Marketing","Branding","Strategy","Other"]},{n:"desc",l:"Description",t:"textarea"},{n:"date",l:"Preferred Date",t:"date"},{n:"ref",l:"How Did You Hear?",t:"text"}]},
nda:{icon:"📋",l:"NDA",desc:"Confidentiality agreement",color:C.muted,fields:[{n:"full_name",l:"Full Name",t:"text",r:1},{n:"email",l:"Email",t:"email",r:1},{n:"phone",l:"Phone",t:"tel",r:1},{n:"company",l:"Company",t:"text"},{n:"title",l:"Title",t:"text"},{n:"purpose",l:"Purpose",t:"textarea",r:1},{n:"date",l:"Date",t:"date"},{n:"sig",l:"Signature (Type Full Name)",t:"text",r:1}]}
};

// ═══ SECTION HEADER (matches app SectionHead exactly) ═══
function SH(icon,text,color){return`<div style="display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:14px">${icon}</span><span style="font-size:11px;letter-spacing:2.5px;color:${color||C.gold};font-weight:700">${text}</span></div></div>`}

// ═══ FEATURED CARD (matches app EventCard — image top, gradient, dot) ═══
function featCard(key,d){
  return`<button onclick="openForm('${key}')" style="${K};width:100%;padding:0;cursor:pointer;text-align:left;font-family:${F.f};overflow:hidden;border-radius:12px;position:relative;border:1px solid ${d.color}25;box-shadow:0 2px 12px rgba(0,0,0,0.3),inset 0 0 0 1px ${d.color}30">
    <div style="height:120px;position:relative;overflow:hidden;background:linear-gradient(135deg,${C.sheet},${C.card})">
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:56px;opacity:.12">${d.icon}</div>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,6,12,0) 60%,rgba(6,6,12,0.6) 100%)"></div>
      <div style="position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px">
        <div style="width:6px;height:6px;border-radius:99px;background:${d.color};box-shadow:0 0 8px ${d.color}"></div>
        <span style="font-size:9px;color:${d.color};font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.8)">${d.cat||"SUBMIT"}</span>
      </div>
    </div>
    <div style="padding:12px 16px">
      <div style="font-size:15px;font-weight:700;margin-bottom:3px;line-height:1.25">${d.l}</div>
      <div style="font-size:12px;color:${C.muted};line-height:1.4">${d.desc}</div>
    </div>
  </button>`}

// ═══ ROW CARD (matches app EventRow — 68px, icon left, chevron right) ═══
function rowCard(key,d){
  return`<button onclick="openForm('${key}')" style="${K};width:100%;padding:0;cursor:pointer;text-align:left;font-family:${F.f};display:flex;gap:0;align-items:stretch;overflow:hidden;border-radius:10px;margin-bottom:0;height:68px">
    <div style="width:68px;height:68px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,rgba(255,255,255,.02),rgba(255,255,255,.04));border-right:1px solid ${C.borderLo||'rgba(255,255,255,0.08)'}">${d.icon}</div>
    <div style="flex:1;padding:10px 14px;min-width:0;display:flex;flex-direction:column;justify-content:center">
      <div style="font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.l}</div>
      <div style="display:flex;align-items:center;gap:4px;margin-top:3px">
        <div style="width:5px;height:5px;border-radius:99px;background:${d.color}"></div>
        <span style="font-size:11px;color:${d.color};font-weight:600">${d.desc.split(",")[0]}</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;padding:0 14px;flex-shrink:0;font-size:16px;color:${C.muted}">›</div>
  </button>`}

// ═══ BUILD PAGE ═══
const root=document.getElementById("root");

// Hero — city skyline style like the app
let html=`
<div style="position:relative;overflow:hidden">
  <div style="height:220px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,rgba(212,168,83,0.08) 0%,${C.bg} 70%)">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,6,12,0.2) 0%,rgba(6,6,12,0) 40%,rgba(6,6,12,0.8) 80%,${C.bg} 100%)"></div>
    <div style="position:absolute;top:0;left:0;right:0;z-index:10;padding:14px 16px;display:flex;align-items:center;justify-content:space-between">
      <div style="background:rgba(0,0,0,0.35);border-radius:20px;padding:6px 14px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(10px)">

      </div>
      <span style="font-size:13px;font-weight:700;letter-spacing:3px;color:${C.gold};text-shadow:0 1px 8px rgba(0,0,0,0.6)">G O O D &nbsp; T I M E S</span>
      <a href="https://good-times-app.vercel.app" style="width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.35);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px">🌙</a>
    </div>
    <div style="position:absolute;top:14px;right:16px;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);z-index:5">
      <div style="width:6px;height:6px;border-radius:99px;background:${C.gold};box-shadow:0 0 8px ${C.gold}"></div>
      <span style="font-size:10px;font-weight:600;color:${C.gold};letter-spacing:1px">OPEN</span>
    </div>
  </div>
</div>

<div style="padding:0 16px;margin-top:-40px;position:relative;z-index:5;text-align:center;margin-bottom:24px">
  <div style="font-size:28px;font-family:${F.s};font-weight:700;line-height:1.1;margin-bottom:6px">Partner With <span style="color:${C.gold};font-style:italic">Good Times</span></div>
  <div style="font-size:12px;color:${C.sec}">Submit your venue, event, or service to join <strong style="color:${C.gold}">837+</strong> curated listings</div>
</div>

<div style="padding:0 16px;margin-bottom:20px">
  <div style="display:flex;gap:0;background:rgba(255,255,255,0.25);border-radius:10px;padding:3px">
    <div style="flex:1;padding:10px 0;border-radius:8px;font-size:13px;font-weight:700;background:${C.goldGrad};color:#0A0A0F;text-align:center;letter-spacing:.3px;font-family:${F.f}">Submit</div>
    <a href="https://good-times-app.vercel.app" style="flex:1;padding:10px 0;border-radius:8px;font-size:13px;font-weight:500;color:#fff;text-align:center;text-decoration:none;font-family:${F.f}">Open App</a>
  </div>
</div>
`;

// Featured forms section
html+=SH("🔥","FEATURED","#FF6B6B");
html+=`<div id="forms" style="padding:0 16px;margin-bottom:20px">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    ${featCard("venue",FM.venue)}
    ${featCard("event",FM.event)}

// All forms section
html+=SH("📋","ALL FORMS",C.blue);
html+=`<div style="padding:0 16px;margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
  ${rowCard("what",FM.what)}
  ${rowCard("vendor",FM.vendor)}
  ${rowCard("artist",FM.artist)}
  ${rowCard("influencer",FM.influencer)}
  ${rowCard("sponsor",FM.sponsor)}
  ${rowCard("inquiry",FM.inquiry)}
  ${rowCard("hiring",FM.hiring)}
  ${rowCard("intern",FM.intern)}
  ${rowCard("consult",FM.consult)}
  ${rowCard("nda",FM.nda)}
</div>`;

// Stats
html+=`<div style="padding:0 16px;margin-bottom:20px">
  <div style="${K};padding:0;overflow:hidden;position:relative;border:1px solid ${C.gold}30">
    <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(212,168,83,0.06),rgba(6,6,12,0.9))"></div>
    <div style="position:relative;z-index:2;padding:16px 20px">
      ${SH("📊","PLATFORM STATS",C.gold)}
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;text-align:center;margin-top:8px">
        <div><div style="font-family:${F.s};font-size:28px;font-weight:300">837<span style="color:${C.gold};font-size:.5em;vertical-align:super">+</span></div><div style="font-size:9px;letter-spacing:2px;color:${C.muted};font-weight:700;margin-top:2px">VENUES</div></div>
        <div><div style="font-family:${F.s};font-size:28px;font-weight:300">10</div><div style="font-size:9px;letter-spacing:2px;color:${C.muted};font-weight:700;margin-top:2px">CITIES</div></div>
        <div><div style="font-family:${F.s};font-size:28px;font-weight:300">48<span style="color:${C.gold};font-size:.5em">hr</span></div><div style="font-size:9px;letter-spacing:2px;color:${C.muted};font-weight:700;margin-top:2px">RESPONSE</div></div>
      </div>
    </div>
  </div>
</div>`;

// Why section
html+=SH("⭐","WHY GOOD TIMES",C.gold);
html+=`<div style="padding:0 16px;margin-bottom:20px">`;
[{t:"Curated, Not Crowded",p:"Every venue is hand-vetted. No pay-to-play. You're listed because you're worth it."},{t:"The Right Audience",p:"People use Good Times when they're deciding — not browsing. Your spot shows up at the moment it matters."},{t:"10 Cities & Growing",p:"ATL, Houston, LA, Dallas, Charlotte, Miami, DC, NY, Phoenix, Scottsdale."},{t:"Built for Night Culture",p:"Not a generic directory. Built by the people who live this — for the people who make cities come alive."}].forEach((w,i)=>{

// ═══ MODAL (bottom sheet — exactly like app's TeamModal/detail) ═══
function openForm(k){
  const d=FM[k];if(!d)return;
  const mo=document.getElementById("mo");
  let h=`<div onclick="event.stopPropagation()" style="width:100%;max-width:480px;margin:0 auto;background:${C.sheet};border-radius:20px 20px 0 0;padding:0;max-height:85vh;display:flex;flex-direction:column;animation:moS .35s cubic-bezier(0.16,1,0.3,1)">
    <div style="width:40px;height:4px;border-radius:99px;background:rgba(255,255,255,0.15);margin:12px auto 0;flex-shrink:0"></div>
    <div style="padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0">
      <div style="font-family:${F.s};font-size:20px;font-weight:400;display:flex;align-items:center;gap:10px"><span>${d.icon}</span>${d.l}</div>
